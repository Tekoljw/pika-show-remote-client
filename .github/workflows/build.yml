name: Build PIKA-Show 远程客户端 (Windows)

# 独立公开仓库，只放"构建外壳"——用途是拿 GitHub 公开仓库的免费无限 Actions
# 分钟数（不受 PIKA-Show 主仓库所在账号的 billing/spending limit 影响），并且
# 用真 Windows Runner 构建 + 冒烟测试（不是本地用 Wine 模拟那种退而求其次的验证）。
#
# ⚠️ 2026-09-17 起不再往这个仓库里同步源码——之前的做法是把 PIKA-Show 私有
# 主仓库 remote-client/ 目录的文件复制过来 commit，等于源码在公开仓库里留了
# 一份副本。管理员明确要求不要这样：改成这个仓库只放这份工作流文件本身，
# 构建时用一把只读 deploy key（存在这个仓库的 Secrets 里，公开仓库对外看不到
# 内容）直接检出私有仓库的 remote-client/ 目录来构建，公开侧永远看不到一行
# 产品代码，只能看到构建脚本和最终编译出的 Release 二进制。
#
# 触发方式从"push 到这个仓库自己"改成手动触发——这个仓库不会再收到代码 push
# 了（没有代码可推），改动流程变成：私有仓库改代码、提版本号、push（那边自己
# 的事）→ 手动跑一次 `gh workflow run build.yml --repo Tekoljw/pika-show-remote-client`
# 触发这次构建。
#
# 自动发布：构建通过后，如果 package.json 的版本号对应的 tag 还没有 Release，
# 就自动建一个。远程客户端 GUI 里的"检查更新"就是查这个仓库的 latest release，
# 没有这一步"检查更新"永远查不到新版本。
#
# 发两份资产，但只有一份是给人看的：`PIKA-Show-Setup-v<版本>.exe`（安装向导，
# 含 QLC+）是**唯一**给人类下载装的入口，README/bot 下载按钮只提这一个。
# `pika-show-remote.exe`（裸 exe）是第二份资产，纯粹给客户端自己"检查更新"
# 热更新用，不出现在任何用户可见的下载页面/说明文档里——管理员的要求是
# "不要给人类三个选择"，不是"内部机制不能有第二个文件"：热更新是程序自己
# 悄悄下载替换，不是人去 Release 页面挑，所以这里不算违反那条要求。
#
# 这条来回改过一次：中间有一版把热更新改成"静默重跑安装向导"，试图做到真的
# 只发一份资产——管理员反馈"不要安装，直接下载文件覆盖"，运行安装程序哪怕是
# /VERYSILENT 完全不可见，在管理员看来仍然是"安装"这个动作，跟"下载一个文件
# 直接换上去"不是一回事，改回原来这套 move 逻辑，见 remote-client/lib/updater.js
# 头部注释。副作用：QLC+ 版本升级不会随热更新生效（热更新只碰程序本体），
# 这是明确接受的取舍。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出私有主仓库的源码（只读 deploy key，公开侧不留一行代码）
        uses: actions/checkout@v4
        with:
          repository: Tekoljw/PIKA-Show
          ssh-key: ${{ secrets.PIKA_SHOW_DEPLOY_KEY }}
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        working-directory: source/remote-client
        run: npm ci

      - name: 冒烟测试——原生模块（serialport/easymidi）在真 Windows 上能不能正常加载
        working-directory: source/remote-client
        run: |
          node -e "
            const { scanDevices } = require('./lib/scan.js');
            scanDevices().then((d) => {
              console.log('SCAN_OK:', JSON.stringify(d));
              process.exit(0);
            }).catch((e) => {
              console.error('SCAN_FAIL:', e.message);
              process.exit(1);
            });
          "

      - name: 冒烟测试——@webviewjs/webview 原生模块能不能加载（不开真窗口，只测 require 不炸）
        working-directory: source/remote-client
        run: |
          node -e "
            const { Application } = require('@webviewjs/webview');
            console.log('WEBVIEW_MODULE_OK:', typeof Application);
          "

      - name: 冒烟测试——engine.js/showStorage.js（node:sqlite）在真 Windows 上能不能正常加载和读写
        working-directory: source/remote-client
        run: |
          node -e "
            const engine = require('./lib/engine.js');
            console.log('ENGINE_REQUIRE_OK:', typeof engine);
            const showStorage = require('./lib/showStorage.js');
            const w = showStorage.writeShow({ id: 'ci-smoke', displayName: 'CI冒烟测试', events: [] });
            console.log('SHOW_WRITE:', JSON.stringify(w));
            const r = showStorage.listShows();
            console.log('SHOW_LIST:', JSON.stringify(r));
            if (!w.ok || !r.ok) process.exit(1);
          "

      - name: 打包成单文件 exe
        working-directory: source/remote-client
        run: npm run build:win

      - name: 解压捆绑的 QLC+——不再要求用户自己单独装，见 remote-client 仓库项目记忆 reference_qlcplus_bundling.md
        # 2026-09-17 起改成从我们自己建的 vendor Release 拿，不再每次构建都现场
        # 去 www.qlcplus.org 下载官方安装包——那台服务器有 Cloudflare WAF/速率
        # 限制，CI 反复被拦（429/"Not Acceptable"），本来就不该每次构建都现场
        # 拉取上游资源（PIKA-Show 主仓库全局工作规则「依赖上游开源项目：只用
        # 自己编译的产物」）。qlcplus-4.14.4-vendor 这个 tag 下的 zip 是从一次
        # 成功构建里拿出来的、已经验证过能正常拉起工作的 qlcplus/ 目录（QLC+
        # 官方安装包解压安装后的完整产物，Apache 2.0 协议下允许重新分发，已带
        # NOTICE.txt），直接下载解压即可，不用再跑 NSIS 静默安装、不用再到处
        # 搜 qlcplus.exe 装到哪了。
        #
        # 以后要升的 QLC+ 版本：手动装一次新版官方安装包、把 qlcplus/ 目录打包
        # 建一个新的 qlcplus-<版本>-vendor Release，再把下面这行 URL 改指向新
        # tag——这是刻意的一次性动作，不是这里自动做的事。
        shell: pwsh
        working-directory: source/remote-client
        run: |
          $qlcZipUrl = "https://github.com/Tekoljw/pika-show-remote-client/releases/download/qlcplus-4.14.4-vendor/qlcplus-4.14.4-win-x64.zip"
          Write-Host "下载自建的 QLC+ vendor 包: $qlcZipUrl"
          Invoke-WebRequest -Uri $qlcZipUrl -OutFile "qlcplus-vendor.zip"
          $fileSize = (Get-Item "qlcplus-vendor.zip").Length
          Write-Host "下载完成，文件大小: $fileSize 字节"
          if ($fileSize -lt 10MB) {
            Write-Error "下载的文件只有 $fileSize 字节，明显不是真的 QLC+ 包（应该有 50-60MB），检查 qlcplus-4.14.4-vendor 这个 Release 的资产是否还在"
            exit 1
          }
          Expand-Archive -Path "qlcplus-vendor.zip" -DestinationPath "dist" -Force
          if (-not (Test-Path "dist\qlcplus\qlcplus.exe")) {
            Write-Error "解压完 dist\qlcplus 里没有 qlcplus.exe，vendor 包内容不对"
            exit 1
          }
          $fileCount = (Get-ChildItem "dist\qlcplus" -Recurse -File).Count
          Write-Host "QLC+ 已捆绑到 dist\qlcplus，共 $fileCount 个文件"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 隐藏命令行窗口——把 exe 的 PE 子系统从 CONSOLE 改成 WINDOWS
        # 用户反馈双击运行时背后那个黑色命令行窗口很碍眼，只需要 GUI 窗口。
        # editbin 随 MSVC Build Tools 一起装，windows-latest runner 自带，
        # 用 ilammy/msvc-dev-cmd 把它加进 PATH。这一步必须在打包之后、冒烟
        # 测试之前——冒烟测试要验证的是真正会发布出去的这个产物。
        working-directory: source/remote-client
        run: editbin /subsystem:windows dist\pika-show-remote.exe

      - name: 冒烟测试——打包后的 exe 能不能正常跑起来，且真的能拉起捆绑的 QLC+
        working-directory: source/remote-client
        run: |
          $p = Start-Process -FilePath "dist\pika-show-remote.exe" -PassThru -RedirectStandardOutput "exe-stdout.log" -RedirectStandardError "exe-stderr.log"
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "exe 启动后自己退出了（应该常驻运行才对），exit code: $($p.ExitCode)"
            Write-Host "---- stdout ----"
            Get-Content "exe-stdout.log" -ErrorAction SilentlyContinue
            Write-Host "---- stderr ----"
            Get-Content "exe-stderr.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "exe 已经跑起来了，进程仍然存活，符合预期（正常会一直连服务端重连）"
          $qlcProc = Get-Process -Name "qlcplus" -ErrorAction SilentlyContinue
          if (-not $qlcProc) {
            Write-Error "qlcplus.exe 没有被拉起来——捆绑的 QLC+ 没生效，检查 qlcEngine.js 的路径解析或这次捆绑的文件是否完整"
            Get-Content "exe-stdout.log" -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Host "捆绑的 QLC+ 已经被成功拉起(PID=$($qlcProc.Id))，路径解析生效"
          Stop-Process -Id $p.Id -Force
          Stop-Process -Id $qlcProc.Id -Force -ErrorAction SilentlyContinue

      - name: 打包成单文件安装向导——用 Inno Setup（windows-latest runner 实测确认自带）
        # 双击一个安装包比"下载 zip、解压、找到 exe 双击"体验好，还能顺手把
        # "开机自动启动"这步自动做掉（installer.iss 里已经处理）。这一步放在
        # 上面冒烟测试通过之后——安装包打包的是已经验证过能正常拉起 QLC+ 的
        # 那份 dist\，不会把一个有问题的产物包进安装包里。
        #
        # 原计划用 NSIS（跟 QLC+ 官方安装包同款工具），CI 实测这个 runner 上
        # NSIS 既不在任何 Program Files 目录也不在 PATH 里，跟官方 readme
        # 软件清单对不上；同一次诊断输出里 Inno Setup 6 确认真实存在于
        # C:\Program Files (x86)\Inno Setup 6，换用它，路径已现查证实。
        shell: pwsh
        working-directory: source/remote-client
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ERROR: ISCC.exe 不在预期路径 $iscc"
            Write-Host "---- C:\Program Files (x86) 内容 ----"
            Get-ChildItem -Path "C:\Program Files (x86)" -ErrorAction SilentlyContinue | Select-Object Name | Out-String | Write-Host
            exit 1
          }
          & $iscc "/DMyAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC 打包安装向导失败，exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "已生成 PIKA-Show-Setup-v$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: pika-show-remote-windows
          path: |
            source/remote-client/dist
            source/remote-client/PIKA-Show-Setup-*.exe
          retention-days: 30

      - name: 自动发布——版本号对应的 tag 不存在才建 Release（版本没提就不重复发布）
        # 显式 --repo 指定发布到这个公开仓库——cwd 在 source/remote-client 下面，
        # 那是私有主仓库的一份检出，gh 会从当前目录的 git remote 猜仓库，猜出来
        # 的会是私有仓库（且这里用的 token 对私有仓库没有写权限），必须每个
        # gh 调用都显式指定 --repo，不能让它自己猜。
        shell: pwsh
        working-directory: source/remote-client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          # 之前这里写的是 ../..，两级会跳到 $GITHUB_WORKSPACE 根——那里根本
          # 没有 checkout 过任何东西，不是 git 仓库。checkout 私有仓库时
          # path: source 指定的是 source/，从 source/remote-client 只需要上
          # 一级（..）就是 source 这个真正的检出根。
          $sourceSha = (git -C .. rev-parse HEAD)
          $exists = gh release view $tag --repo Tekoljw/pika-show-remote-client 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，跳过（package.json 版本号没提就不会重复发布）"
          } else {
            Write-Host "创建 Release $tag"
            # 注意：--notes 的值是双引号字符串，里面不能再放裸的英文双引号
            # （会被 pwsh 当成字符串提前结束），用「」代替强调用的引号。
            gh release create $tag "PIKA-Show-Setup-v$version.exe" "dist/pika-show-remote.exe" `
              --repo Tekoljw/pika-show-remote-client `
              --title "PIKA-Show 远程客户端 $tag" `
              --notes "自动构建发布，源码来自私有主仓库 commit $sourceSha。`n`n下载 PIKA-Show-Setup-v$version.exe 双击安装（含捆绑的 QLC+，自动配开机启动）——**人类只需要这一个文件**。pika-show-remote.exe 是给客户端「检查更新」热更新用的裸文件，不需要手动下载。"
          }
