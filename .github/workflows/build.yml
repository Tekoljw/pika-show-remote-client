name: Build PIKA-Show 远程客户端 (Windows)

# 独立公开仓库，只放这个远程客户端——用途是拿 GitHub 公开仓库的免费无限 Actions
# 分钟数（不受 PIKA-Show 主仓库所在账号的 billing/spending limit 影响），并且
# 用真 Windows Runner 构建 + 冒烟测试（不是本地用 Wine 模拟那种退而求其次的验证）。
# 这个仓库是 PIKA-Show 私有主仓库 remote-client/ 目录的构建镜像，不是独立开发的
# 代码——改动应该先在主仓库改，再同步过来，不要直接在这里改代码。
#
# 2026-09 加了自动发布：构建通过后，如果 package.json 的版本号对应的 tag 还
# 没有 Release，就自动建一个并把 exe 挂上去——远程客户端 GUI 里的"检查更新"
# 就是查这个仓库的 latest release，没有这一步"检查更新"永远查不到新版本。
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm ci

      - name: 冒烟测试——原生模块（serialport/easymidi）在真 Windows 上能不能正常加载
        run: |
          node -e "
            const { scanDevices } = require('./lib/scan.js');
            scanDevices().then((d) => {
              console.log('SCAN_OK:', JSON.stringify(d));
              process.exit(0);
            }).catch((e) => {
              console.error('SCAN_FAIL:', e.message);
              process.exit(1);
            });
          "

      - name: 冒烟测试——@webviewjs/webview 原生模块能不能加载（不开真窗口，只测 require 不炸）
        run: |
          node -e "
            const { Application } = require('@webviewjs/webview');
            console.log('WEBVIEW_MODULE_OK:', typeof Application);
          "

      - name: 冒烟测试——engine.js/showStorage.js（node:sqlite）在真 Windows 上能不能正常加载和读写
        run: |
          node -e "
            const engine = require('./lib/engine.js');
            console.log('ENGINE_REQUIRE_OK:', typeof engine);
            const showStorage = require('./lib/showStorage.js');
            const w = showStorage.writeShow({ id: 'ci-smoke', displayName: 'CI冒烟测试', events: [] });
            console.log('SHOW_WRITE:', JSON.stringify(w));
            const r = showStorage.listShows();
            console.log('SHOW_LIST:', JSON.stringify(r));
            if (!w.ok || !r.ok) process.exit(1);
          "

      - name: 打包成单文件 exe
        run: npm run build:win

      - name: 下载并静默安装 QLC+——不再要求用户自己单独装，见 remote-client 仓库项目记忆 reference_qlcplus_bundling.md
        # QLC+（mcallegari/qlcplus，Apache 2.0 协议，查证过允许这样重新分发）
        # 的 GitHub Release 不带任何二进制 asset，真正的 Windows 安装包托管在
        # 官网自己的下载服务器，是个 NSIS 安装包。第一版尝试用 7-Zip 直接解开
        # （不运行安装程序）失败了——解压后找不到 qlcplus.exe，大概率是这个
        # 安装包用了 7z 的 NSIS 插件处理不了的嵌套压缩格式。改用 NSIS 官方
        # 支持的静默安装参数（/S /D=<目录>，这是 NSIS 提供的标准自动化机制，
        # 不是我们猜的）实际装一遍，比逆向 7z 提取更可靠。/D= 是 NSIS 的已知
        # 坑：必须是最后一个参数，且路径不能加引号，所以目标目录故意选了个
        # 不含空格的路径。
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $qlcVersion = "5.2.2"
          $qlcUrl = "https://www.qlcplus.org/downloads/$qlcVersion/QLC+_$qlcVersion.exe"
          Write-Host "下载 QLC+ $qlcVersion : $qlcUrl"
          # qlcplus.org 前面挂了 Cloudflare/ModSecurity，太简短的 User-Agent
          # （比如单纯 "Mozilla/5.0"）会被当成疑似机器人直接拦截返回
          # "Not Acceptable" 错误页——之前一次 CI 运行就是这样，返回的是几百
          # 字节的错误页 HTML 而不是真的安装包。换成完整的浏览器 UA 字符串。
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          Invoke-WebRequest -Uri $qlcUrl -OutFile "qlcplus-installer.exe" -UserAgent $ua
          $fileSize = (Get-Item "qlcplus-installer.exe").Length
          Write-Host "下载完成，文件大小: $fileSize 字节"
          if ($fileSize -lt 10MB) {
            Write-Error "下载的文件只有 $fileSize 字节，明显不是真的安装包（应该有 40-60MB），大概率是官网的 WAF 拦截返回了错误页面而不是真的文件"
            Write-Host "---- 文件内容预览 ----"
            Get-Content "qlcplus-installer.exe" -TotalCount 20 -ErrorAction SilentlyContinue
            exit 1
          }
          # 实测确认的真实默认安装目录：C:\QLC+5（5.x 大版本号会带进目录名，
          # 官方 .nsi 脚本源码里查到的是没带版本号的 C:\QLC+，那份脚本对应的
          # 是旧版本的构建配置，5.2.2 这个具体安装包实际用的目录名不一样——
          # 不再猜测/硬编码固定名字，装完之后用通配符现查，以后 QLC+ 出新大版本
          # 目录名字再变也不用跟着改这里。
          $proc = Start-Process -FilePath "qlcplus-installer.exe" -ArgumentList "/S" -Wait -PassThru
          Write-Host "安装程序退出码: $($proc.ExitCode)"
          Start-Sleep -Seconds 3
          # C:\QLC+5 是 windows-latest 镜像本来就有的目录（不是这次安装产生的——
          # 跟 Android/Julia/PostgreSQL 这些平级，属于镜像自带的预装软件列表），
          # 之前两轮误以为是安装产物，排查方向错了。这次改成直接大范围搜：
          # Program Files 系列 + 当前用户的 LOCALAPPDATA/APPDATA（不少现代
          # NSIS 安装包在非管理员权限下会装到这些用户目录，跟旧版 .nsi 脚本里
          # RequestExecutionLevel user 这行对得上），仍然不碰整个 C 盘。
          $searchRoots = @("C:\Program Files", "C:\Program Files (x86)", $env:LOCALAPPDATA, $env:APPDATA) | Where-Object { $_ -and (Test-Path $_) }
          $installDir = $null
          foreach ($root in $searchRoots) {
            $hit = Get-ChildItem -Path $root -Recurse -Filter "qlcplus.exe" -ErrorAction SilentlyContinue -Depth 4 | Select-Object -First 1
            if ($hit) { $installDir = $hit.DirectoryName; break }
          }
          if (-not $installDir) {
            # 用 Write-Host 不用 Write-Error——pwsh 在 GH Actions 里 $ErrorActionPreference
            # 默认是 Stop，Write-Error 会是终止性错误，直接跳过后面所有诊断输出，
            # 之前几次运行就是这样白白损失了排查信息。
            Write-Host "ERROR: 在 Program Files/LOCALAPPDATA/APPDATA 里都没找到 qlcplus.exe"
            Write-Host "---- C:\QLC+5 目录内容（镜像自带，确认一下到底是什么）----"
            if (Test-Path "C:\QLC+5") { Get-ChildItem -Path "C:\QLC+5" -ErrorAction SilentlyContinue | Select-Object Name | Out-String | Write-Host }
            Write-Host "---- C:\Program Files 内容 ----"
            Get-ChildItem -Path "C:\Program Files" -ErrorAction SilentlyContinue | Select-Object Name | Out-String | Write-Host
            Write-Host "---- C:\Program Files (x86) 内容 ----"
            Get-ChildItem -Path "C:\Program Files (x86)" -ErrorAction SilentlyContinue | Select-Object Name | Out-String | Write-Host
            Write-Host "---- $env:LOCALAPPDATA 内容 ----"
            Get-ChildItem -Path $env:LOCALAPPDATA -ErrorAction SilentlyContinue | Select-Object Name | Out-String | Write-Host
            exit 1
          }
          Write-Host "找到 QLC+ 可执行文件: $installDir\qlcplus.exe"
          Copy-Item -Path $installDir -Destination "dist\qlcplus" -Recurse -Force
          $fileCount = (Get-ChildItem "dist\qlcplus" -Recurse -File).Count
          Write-Host "QLC+ 已捆绑到 dist\qlcplus，共 $fileCount 个文件"
          $existingLicense = Get-ChildItem -Path "dist\qlcplus" -Include "LICENSE*","COPYING*" -Recurse -ErrorAction SilentlyContinue
          if (-not $existingLicense) {
            "QLC+ (https://www.qlcplus.org/) is bundled with this distribution under the Apache License, Version 2.0.`nFull license text: https://www.apache.org/licenses/LICENSE-2.0`nSource code: https://github.com/mcallegari/qlcplus" | Out-File -FilePath "dist\qlcplus\NOTICE.txt" -Encoding utf8
            Write-Host "QLC+ 安装包里没带许可证文件，已生成 NOTICE.txt 补充授权说明"
          }

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 隐藏命令行窗口——把 exe 的 PE 子系统从 CONSOLE 改成 WINDOWS
        # 用户反馈双击运行时背后那个黑色命令行窗口很碍眼，只需要 GUI 窗口。
        # editbin 随 MSVC Build Tools 一起装，windows-latest runner 自带，
        # 用 ilammy/msvc-dev-cmd 把它加进 PATH。这一步必须在打包之后、冒烟
        # 测试之前——冒烟测试要验证的是真正会发布出去的这个产物。
        run: editbin /subsystem:windows dist\pika-show-remote.exe

      - name: 冒烟测试——打包后的 exe 能不能正常跑起来，且真的能拉起捆绑的 QLC+
        run: |
          $p = Start-Process -FilePath "dist\pika-show-remote.exe" -PassThru -RedirectStandardOutput "exe-stdout.log" -RedirectStandardError "exe-stderr.log"
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "exe 启动后自己退出了（应该常驻运行才对），exit code: $($p.ExitCode)"
            Write-Host "---- stdout ----"
            Get-Content "exe-stdout.log" -ErrorAction SilentlyContinue
            Write-Host "---- stderr ----"
            Get-Content "exe-stderr.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "exe 已经跑起来了，进程仍然存活，符合预期（正常会一直连服务端重连）"
          $qlcProc = Get-Process -Name "qlcplus" -ErrorAction SilentlyContinue
          if (-not $qlcProc) {
            Write-Error "qlcplus.exe 没有被拉起来——捆绑的 QLC+ 没生效，检查 qlcEngine.js 的路径解析或这次捆绑的文件是否完整"
            Get-Content "exe-stdout.log" -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Host "捆绑的 QLC+ 已经被成功拉起(PID=$($qlcProc.Id))，路径解析生效"
          Stop-Process -Id $p.Id -Force
          Stop-Process -Id $qlcProc.Id -Force -ErrorAction SilentlyContinue

      - name: 打包发布用的 zip——完整目录（exe + 捆绑的 QLC+），供用户首次下载解压使用
        # GitHub Release 单独还会挂一份裸 exe（见下面发布步骤），是因为
        # updater.js 的 checkForUpdate() 现在只认 .exe 结尾的 asset 做热更新，
        # 热更新目前只替换这一个文件、不碰 qlcplus/ 目录（见 remote-client
        # 项目记忆 reference_qlcplus_bundling.md 的已知限制）——两份都发，
        # 各自服务不同场景，互不冲突。
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist\*" -DestinationPath "pika-show-remote-v$version.zip" -Force
          Write-Host "已生成 pika-show-remote-v$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pika-show-remote-windows
          path: dist
          retention-days: 30

      - name: 自动发布——版本号对应的 tag 不存在才建 Release（版本没提就不重复发布）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，跳过（package.json 版本号没提就不会重复发布）"
          } else {
            Write-Host "创建 Release $tag"
            gh release create $tag "dist/pika-show-remote.exe" "pika-show-remote-v$version.zip" `
              --title "PIKA-Show 远程客户端 $tag" `
              --notes "自动构建发布，来自 commit ${{ github.sha }}。`n`n- pika-show-remote.exe：裸 exe，给已装过 QLC+ 的老用户 / 热更新用`n- pika-show-remote-v$version.zip：完整包（含捆绑的 QLC+），新用户首次安装用这个"
          }
